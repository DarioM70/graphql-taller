# Render.com Blueprint (alternative to Railway). Deploy with:
#   New + > Blueprint > point at this repo.
# Provisions a managed PostgreSQL and a Dockerfile-based web service wired to it.
databases:
  - name: graphql-taller-db
    plan: free

services:
  - type: web
    name: graphql-taller
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: graphql-taller-db
          property: connectionString
