name: CI

# Continuous Integration: install, build and run the full test suite on every
# push and PR. Continuous Deployment is handled by Railway's native GitHub
# integration (Service → Settings → Source → Connect Repo): once connected,
# Railway builds the Dockerfile and redeploys automatically on every push to
# `main`. This workflow acts as the quality gate before that deploy.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: file:./test.db
      JWT_SECRET: ci_test_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check & build
        run: npm run build

      - name: Run tests (Jest + Supertest)
        run: npm test
