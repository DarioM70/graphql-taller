# Operaciones de ejemplo para el Apollo Sandbox (endpoint /graphql).
# Tras hacer login, agregue el header HTTP en el Sandbox:
#   { "Authorization": "Bearer <token>" }

# ---------- AUTH ----------
mutation Signup {
  signup(input: { fullName: "Ada Lovelace", email: "ada@taller.com", password: "Secret123*" }) {
    token
    user { id fullName email roles }
  }
}

mutation Login {
  login(input: { email: "admin@taller.com", password: "Admin123*" }) {
    token
    user { id email roles }
  }
}

query Me {
  me { id fullName email roles isActive }
}

# ---------- USERS (superadmin) ----------
query Users {
  users { id fullName email roles }
}

mutation CreateUser {
  createUser(input: { fullName: "Regular", email: "regular@taller.com", password: "User123*", roles: ["user"] }) {
    id email roles
  }
}

# ---------- PROJECTS ----------
mutation CreateProject {
  createProject(input: { name: "Plataforma X", description: "Proyecto demo" }) {
    id name owner { email roles }
  }
}

query Projects {
  projects {
    id
    name
    owner { email }
    tasks { title status assignee { email } }
    comments { content author { email } }
  }
}

# ---------- TASKS (reemplace PROJECT_ID) ----------
mutation CreateTask {
  createTask(input: { projectId: "PROJECT_ID", title: "Diseñar el esquema", status: TODO }) {
    id title status
  }
}

mutation UpdateTask {
  updateTask(id: "TASK_ID", input: { status: DONE }) {
    id status
  }
}

# ---------- COMMENTS ----------
mutation CreateComment {
  createComment(input: { projectId: "PROJECT_ID", content: "¡Buen avance!" }) {
    id content author { email }
  }
}

query Comments {
  comments(projectId: "PROJECT_ID") {
    id content author { email }
  }
}
