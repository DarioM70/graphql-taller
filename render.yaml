# Render.com Blueprint. Deploy with: New + > Blueprint > point at this repo.
# Uses the Dockerfile. For durable data across deploys, attach a Postgres
# instance and set DATABASE_URL to its connection string (and switch the
# provider in prisma/schema.prisma to "postgresql").
services:
  - type: web
    name: graphql-taller
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        value: file:./prod.db
