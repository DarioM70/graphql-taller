name: CI/CD

# CI runs on every push and PR: install, build and run the full test suite.
# CD: the `deploy` job ships to Railway on pushes to `main` when a RAILWAY_TOKEN
# secret is present. (Railway's GitHub integration can also auto-deploy on push;
# this job makes the CD step explicit in the pipeline.)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: file:./test.db
      JWT_SECRET: ci_test_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check & build
        run: npm run build

      - name: Run tests (Jest + Supertest)
        run: npm test

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping CLI deploy."
            echo "Railway's GitHub integration handles auto-deploy on push instead."
            exit 0
          fi
          railway up --ci --service graphql-taller
