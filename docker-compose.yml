# Local PostgreSQL for development and tests.
#   docker compose up -d db        # start
#   docker compose down            # stop
#
# Exposes two databases via the same server:
#   - graphql_taller       (dev,  used by `npm run dev`)
#   - graphql_taller_test  (tests, used by `npm test`; created on first init)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphql_taller
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
