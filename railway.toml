# Railway configuration. Builds from the Dockerfile (NestJS) and health-checks
# the REST liveness route at /api/health. DATABASE_URL references the managed
# Postgres service via ${{Postgres.DATABASE_URL}} (private network).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
