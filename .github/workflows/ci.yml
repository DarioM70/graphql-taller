name: CI

# Continuous Integration: install, build (nest build) and run the e2e test suite
# against a disposable PostgreSQL service. Continuous Deployment is handled by
# Railway's native GitHub integration (redeploys on push to main).

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphql_taller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/graphql_taller_test
      JWT_SECRET: ci_test_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (nest build)
        run: npm run build

      - name: Run e2e tests (Jest + Supertest)
        run: npm run test:e2e
